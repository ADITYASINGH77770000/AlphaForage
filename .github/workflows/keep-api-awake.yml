# ─────────────────────────────────────────────────────────────────────────────
# Best-effort ping of the Render free instance. It does NOT keep it awake.
#
# Render spins a free web service down after ~15 minutes without traffic, and
# waking it takes 60-90 seconds. This workflow asks for a run every 10 minutes,
# but GitHub delays scheduled runs heavily on the free tier: across 200 runs
# (Sep-Oct 2026) the median gap was about four hours and none was under 15
# minutes, so the service still sleeps between pings.
#
# The portal copes with a sleeping API on its own; see frontend/lib/wake.ts. To
# really keep it warm, use an external pinger on a 5-10 minute interval, or a
# paid instance. One always-on free service uses about 730 of the 750 free
# instance-hours in a month, so that fits only while it is the ONLY free service.
#
# GitHub also disables scheduled workflows after 60 days without a push, which
# happened on 2026-10-23. Push anything, or enable it again in the Actions tab.
# ─────────────────────────────────────────────────────────────────────────────
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-api-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        run: |
          URL="https://alphaforge-api-umrl.onrender.com/api/config"
          # A cold wake can take ~90s, so allow well past that before failing.
          code=$(curl -sS -o /dev/null -w "%{http_code}" -m 150 "$URL" || echo "000")
          echo "GET $URL -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::API returned $code — it may be waking, suspended, or out of free hours."
          fi
